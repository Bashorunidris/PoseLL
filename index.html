.ring span,.lgl{background:var(--logo) center/contain no-repeat!important}.ring span *,.lgl *{display:none}
.lgo{background:var(--logo) center/contain no-repeat;border-radius:0}.lgo *{display:none}
.sp{min-height:100%;background:#0B0710}
.spn{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#0B0710ee;border-bottom:1px solid #ffffff24}
.spb{display:flex;gap:8px;align-items:center;background:#E3B34D1a;border:1px solid #E3B34D40;border-radius:99px;padding:7px 14px;color:var(--gold)}
.mono2{font-family:'JetBrains Mono',monospace;font-weight:700}
.sph{text-align:center;padding:30px 18px 10px;background:radial-gradient(ellipse 700px 400px at 50% -10%,#8355ff38,transparent 65%),radial-gradient(ellipse 500px 300px at 90% 10%,#e3b34d1a,transparent 60%)}
.spbadge{display:inline-flex;gap:8px;align-items:center;background:#e3b34d1a;border:1px solid #e3b34d40;border-radius:99px;padding:6px 16px;font-size:10px;letter-spacing:2.5px;color:var(--gold2);font-weight:700}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.sph h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(46px,16vw,76px);letter-spacing:5px;line-height:.95;margin:16px 0 10px}.sph h1 em,.spm h2 em{font-style:normal;color:var(--gold)}
.spr{max-width:520px;margin:22px auto;background:#1C1430;border:1px solid #ffffff24;border-radius:22px;padding:20px 24px;text-align:left}
.spr1{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:#BDB4D6;font-weight:700}.spr1 .tg{background:#e3b34d26;color:var(--gold2);border-radius:99px;padding:4px 10px;font-size:9px}
.spp{font-size:40px;margin:10px 0 4px}
.spm{padding:20px 16px 60px;max-width:960px;margin:0 auto}.spl{color:var(--gold);letter-spacing:3px;font-size:11px;font-weight:700}
.spm h2{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,8vw,44px);letter-spacing:3px;margin:6px 0 8px}
.spk{display:flex;gap:14px;overflow-x:auto;padding:18px 4px;scrollbar-width:none}
.pkc{flex:0 0 62vw;max-width:230px;background:#1C1430;border:1px solid #ffffff24;border-radius:20px;padding:18px 16px;position:relative}.pkc.pop{border-color:var(--gold);box-shadow:0 8px 28px #e3b34d1f}
.pkc small{font-size:9px;letter-spacing:2.5px;color:#BDB4D6;font-weight:700}.pc{font-size:36px;color:var(--gold2);margin:6px 0 4px}.pc span{font-size:10px;font-family:'DM Sans';color:#BDB4D6;font-weight:500}
.pb2{font-size:11px;color:#B79CFF;font-weight:600;margin-bottom:12px;min-height:16px}.pkc hr{border:0;height:1px;background:#ffffff24;margin:0 0 12px}.pr2{font-size:26px}.pfn{font-size:10px;color:#8A80A8;margin:4px 0 14px}
.ptag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--gold2),#9C7420);color:#000;font-size:8px;font-weight:800;letter-spacing:1.5px;padding:4px 10px;border-radius:99px;white-space:nowrap}

async function api(path,b){

const MB=1048576,CATS=['Movies','Series','Comedy','Music Video','Dance','Afrobeats','Gospel','Nollywood','Documentary','Tutorial'];
// Uploads a file to Cloudflare R2 through /api/r2-presign. Returns {p:Promise<publicUrl>, abort()}.
// Your live Pose site's existing Cloudflare presign endpoint (change this if your live site address is different)
const R2_PRESIGN='/api/r2-presign';
function r2(file,onp){let x;const p=(async()=>{
 const body={filename:file.name,contentType:file.type||'application/octet-stream',folder:'lagoslife'};
 const r=await fetch(R2_PRESIGN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok){const j=await r.json().catch(()=>({}));throw Error('upload setup failed ('+(j.error||r.status)+')')}
 const j=await r.json();
 await new Promise((ok,no)=>{x=new XMLHttpRequest();x.open('PUT',j.uploadUrl);x.setRequestHeader('Content-Type',body.contentType);
  x.upload.onprogress=e=>{if(e.lengthComputable&&onp)onp(e.loaded/e.total)};x.onload=()=>x.status<300?ok():no(Error('upload failed ('+x.status+')'));
  x.onerror=()=>no(Error('network error. Check R2 CORS'));x.onabort=()=>no(Error('cancelled'));x.send(file)});
 return j.publicUrl})();return{p,abort:()=>x&&x.abort()}}
